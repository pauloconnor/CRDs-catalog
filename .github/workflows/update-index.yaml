name: Update index.yaml
on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install pyyaml

    - name: Run auto-update script
      run: python Utilities/auto-update-index.py . index.yaml

    - name: Create or update PR
      uses: peter-evans/create-pull-request@v7
      with:
        branch: auto-update/index-yaml
        commit-message: "chore: update index.yaml"
        title: "chore: update index.yaml"
        body: Automated update of index.yaml
        delete-branch: true
